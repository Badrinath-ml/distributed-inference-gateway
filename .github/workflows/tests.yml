name: Tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install gateway dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script": self.active = True
              def handle_endtag(self, tag):
                  if tag == "script": self.active = False
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
          parser = Scripts()
          parser.feed(Path("dashboard/index.html").read_text(encoding="utf-8"))
          Path("/tmp/dashboard-inline.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/dashboard-inline.js
      - name: Run unit and integration tests
        env:
          OPENROUTER_ENABLED: "false"
          MOCK_WORKER_ENABLED: "false"
          VLLM_BASE_URL: "http://127.0.0.1:8000"
          VLLM_MODEL: "Qwen/Qwen3-1.7B"
        run: PYTHONPATH=. python -m unittest discover -s tests -v
